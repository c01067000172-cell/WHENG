<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta name="description" content="WHENG 생활설비 - 사랑을 실은 설비공. 수전·변기·세면대·배관·누수 생활설비">
  <meta name="theme-color" content="#08766d">
  <title>WHENG 생활설비 | 사랑을 실은 설비공</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="top" class="approved-page">
    <div id="mockupShell" class="mockup-shell">
      <img class="mockup-image" src="assets/wheng-approved-home.jpg" alt="WHENG 사랑을 실은 설비공 홈페이지">

      <button class="hotspot nav-service" data-scroll="0.43" aria-label="서비스"></button>
      <button class="hotspot nav-cases" data-scroll="0.80" aria-label="시공사례"></button>
      <button class="hotspot nav-reviews" data-scroll="0.80" aria-label="고객후기"></button>
      <button class="hotspot nav-about" data-scroll="0.57" aria-label="WHENG 소개"></button>
      <a class="hotspot nav-phone" data-phone-link href="tel:01000000000" aria-label="전화 상담"></a>

      <button class="hotspot hero-quote" data-open-quote aria-label="빠른 견적 받기"></button>
      <a class="hotspot hero-phone" data-phone-link href="tel:01000000000" aria-label="전화 상담"></a>
      <button class="hotspot cases-more" data-scroll="0.80" aria-label="시공사례 더보기"></button>
      <button class="hotspot reviews-more" data-scroll="0.80" aria-label="고객후기 더보기"></button>
    </div>
  </main>

  <div id="quoteModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="quoteTitle">
    <div class="modal-backdrop" data-close-quote></div>
    <section class="quote-card">
      <div class="quote-head">
        <div><small>WHENG 빠른 견적</small><h2 id="quoteTitle">사진으로 빠르게 상담받기</h2></div>
        <button class="modal-close" type="button" data-close-quote aria-label="닫기">×</button>
      </div>
      <form id="quoteForm">
        <div class="form-row">
          <label>지역<input required name="area" placeholder="예: 수원 권선구"></label>
          <label>작업 종류<select required name="service"><option value="">선택</option><option>수전 교체</option><option>변기 교체</option><option>세면대 교체</option><option>배관·누수</option><option>각종 설비</option><option>보일러 분배기</option><option>기타</option></select></label>
        </div>
        <label>증상 설명<textarea required name="issue" rows="4" placeholder="불편한 증상을 적어주세요."></textarea></label>
        <div class="form-row">
          <label>연락처<input required name="phone" inputmode="tel" placeholder="010-1234-5678"></label>
          <label>희망 방문일<input name="date" type="date"></label>
        </div>
        <label class="upload">사진 첨부 <span>최대 5장 · 장당 5MB 이하</span><input name="photos" type="file" accept="image/*" multiple></label>
        <div class="photo-preview" id="photoPreview"></div>
        <details class="privacy-details"><summary>개인정보 수집·이용 내용</summary><div><b>목적</b> 견적 상담·방문 일정 조율·문의 응대<br><b>항목</b> 지역·연락처·문의내용·희망일·첨부사진<br><b>보유</b> 상담 종료 후 3개월, 시공 고객은 시공 완료 후 1년</div></details>
        <label class="privacy"><input required type="checkbox"> 개인정보 수집·이용에 동의합니다.</label>
        <button class="submit-btn" type="submit">무료 견적 요청하기</button>
        <p id="formNote" class="form-note"><span id="siteMode">실시간 접수 운영</span> · 확인 후 연락드리겠습니다.</p>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
