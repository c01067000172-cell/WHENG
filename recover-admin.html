<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WHENG 관리자 복구</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.card{width:min(100%,440px);background:#1b1b1b;border:1px solid #333;border-radius:16px;padding:24px;box-sizing:border-box}
h1{font-size:24px;margin:0 0 8px}.muted{color:#bbb;line-height:1.6}.field{display:block;margin:16px 0 0}.field input{width:100%;box-sizing:border-box;margin-top:7px;padding:14px;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff;font-size:16px}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:800;font-size:16px}
#msg{margin-top:14px;line-height:1.6}.ok{color:#58d68d}.err{color:#ff7b72}
a{color:#fff}
</style>
</head>
<body>
<div class="card">
<h1>WHENG 관리자 복구</h1>
<p class="muted">관리자 이메일: <b>solbi081@naver.com</b><br>새 비밀번호를 입력해 복구 계정을 만듭니다.</p>
<form id="form">
<label class="field">새 비밀번호<input id="pw" type="password" minlength="6" required autocomplete="new-password"></label>
<label class="field">비밀번호 확인<input id="pw2" type="password" minlength="6" required autocomplete="new-password"></label>
<button type="submit">복구 계정 만들기</button>
</form>
<p id="msg" class="muted"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const msg=document.getElementById('msg');
const client=window.supabase.createClient(window.WHENG_CONFIG.supabaseUrl,window.WHENG_CONFIG.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const p=document.getElementById('pw').value;
 const p2=document.getElementById('pw2').value;
 if(p!==p2){msg.className='err';msg.textContent='비밀번호가 서로 다릅니다.';return;}
 msg.className='muted';msg.textContent='복구 계정을 만들고 있습니다...';
 const {data,error}=await client.auth.signUp({email:'solbi081@naver.com',password:p});
 if(error){msg.className='err';msg.textContent=error.message;return;}
 if(data.session){
   msg.className='ok';msg.innerHTML='계정 생성 완료. <a href="admin.html">관리자 로그인으로 이동</a>';
 }else{
   msg.className='ok';msg.innerHTML='인증 메일을 보냈습니다. 네이버 메일에서 인증 링크를 누른 뒤 <a href="admin.html">관리자 로그인</a>으로 돌아오세요.';
 }
});
</script>
</body>
</html>
